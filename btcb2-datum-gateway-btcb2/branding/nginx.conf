# Branding proxy for the DATUM Gateway dashboard.
#
# The gateway compiles its web pages into the binary, so the stock image
# always shows the DATUM logo. This proxy sits between Umbrel's app_proxy and
# the gateway, swaps the header logo for the BTCB2 logo and serves the BTCB2
# favicon. Everything else (Status, Config saves, login) passes through.
#
# If a future gateway image changes the header markup, the sub_filter simply
# stops matching and the stock DATUM header shows again; nothing breaks.

server {
    listen 21010;

    location = /assets/icons/btcb2_logo.png {
        alias /etc/nginx/btcb2/btcb2_logo.png;
        default_type image/png;
    }

    location = /assets/icons/favicon.ico {
        alias /etc/nginx/btcb2/favicon.ico;
        default_type image/x-icon;
    }

    location = /favicon.ico {
        alias /etc/nginx/btcb2/favicon.ico;
        default_type image/x-icon;
    }

    location / {
        proxy_pass http://gateway:21010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # sub_filter only works on uncompressed bodies.
        proxy_set_header Accept-Encoding "";
        proxy_read_timeout 120s;

        sub_filter_types text/html;
        sub_filter_once on;
        sub_filter '<img src="/assets/icons/datum_logo.svg" alt="(DATUM Logo)" style="vertical-align: text-top" width="28" height="33"> DATUM <span>GATEWAY</span>' '<img src="/assets/icons/btcb2_logo.png" alt="BTCB2" style="vertical-align: middle; margin: 12px 0" width="172" height="44">';
    }
}
