version: "3.7"

services:
  app_proxy:
    environment:
      # Umbrel proxy in front of the DATUM Gateway dashboard (Status / Config / Clients / Threads / Coinbaser).
      # Goes through the branding proxy (web), which shows the BTCB2 logo.
      APP_HOST: btcb2-datum-gateway-btcb2_web_1
      APP_PORT: 21010

  web:
    # Branding proxy: swaps the dashboard's DATUM header and favicon for BTCB2.
    # Self-contained (config and images written at start) because umbreld does
    # not copy new app folders into app-data on update. If the gateway's header
    # markup ever changes, the stock header shows again; nothing else breaks.
    image: nginx:1.27-alpine
    restart: on-failure
    depends_on:
      - gateway
    command:
      - /bin/sh
      - -c
      - |
        set -e
        mkdir -p /usr/share/nginx/btcb2
        echo '' | base64 -d > /usr/share/nginx/btcb2/logo.png
        echo '' | base64 -d > /usr/share/nginx/btcb2/favicon.png
        cat > /etc/nginx/conf.d/default.conf <<'NGINXCONF'
          server {
            listen 21010;
            location /btcb2/ {
              root /usr/share/nginx;
              expires 1d;
            }
            location = /favicon.ico {
              alias /usr/share/nginx/btcb2/favicon.png;
              default_type image/png;
            }
            location / {
              proxy_pass http://gateway:21010;
              proxy_http_version 1.1;
              proxy_set_header Host $$host;
              proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
              proxy_set_header Accept-Encoding "";
              proxy_read_timeout 120s;
              sub_filter_once on;
              sub_filter '<img src="/assets/icons/datum_logo.svg" alt="(DATUM Logo)" style="vertical-align: text-top" width="28" height="33"> DATUM <span>GATEWAY</span>' '<img src="/btcb2/logo.png" alt="BTCB2" style="vertical-align: middle; margin: 12px 0" width="172" height="44">';
              sub_filter '<link rel="icon" type="image/x-icon" href="/assets/icons/favicon.ico">' '<link rel="icon" type="image/png" href="/btcb2/favicon.png">';
            }
          }
        NGINXCONF
        nginx -t
        exec nginx -g 'daemon off;'

  gateway:
    # BLAKE2b DATUM Gateway image (same family as working Umbrel BTCB2 installs).
    image: ghcr.io/horizon-btc/datum:v1.14-blake2b-5@sha256:da91a18a852f9e5018a3e18f54b3318b42ef22d9fa9a43b4c4b525f82065fb7d
    # Run the binary directly so the Config tab can persist changes (same pattern as official DATUM / paulscode).
    entrypoint: ["/app/datum_gateway"]
    command: ["--config=/app/conf/datum_gateway_config.json"]
    user: "1000:1000"
    restart: on-failure
    stop_grace_period: 30s
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    volumes:
      - ${APP_DATA_DIR}/data/settings/:/app/conf/
    ports:
      # Stratum for miners on your LAN (not the official DATUM app's 23334).
      - "23340:23340"
    networks:
      default:
        ipv4_address: $APP_DATUM_GATEWAY_BTCB2_IP
